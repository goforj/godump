version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      monthly-version-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      monthly-version-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /examples
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      monthly-version-updates:
        patterns: ["*"]
        update-types: [minor, patch]
