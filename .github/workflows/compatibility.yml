name: Compatibility Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  go-versions:
    name: Lookup Go versions
    runs-on: ubuntu-latest
    outputs:
      go-mod-version: ${{ steps.versions.outputs.go-mod-version }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: arnested/go-version-action@83df3d2be676ba748e3c243a7f996e76c28cff23 # v2
        id: versions
        with:
          unstable: true # this includes the future -rc versions

  go-compatibility:
    needs: go-versions
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: ["${{ needs.go-versions.outputs.go-mod-version }}", "oldstable", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Run tests
        run: go test ./... -v -race
        timeout-minutes: 8

      - name: Run examples tests
        working-directory: examples
        run: go test ./... -v -race
        timeout-minutes: 8

  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          (cd examples && go mod tidy)
          git diff --exit-code go.mod go.sum examples/go.mod examples/go.sum
        timeout-minutes: 2

      - name: Check for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
          (cd examples && govulncheck ./...)
        timeout-minutes: 5
